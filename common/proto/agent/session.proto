syntax = "proto3";

package skynet.agent.v1;

import "common.proto";
import "agent/types.proto";

message AgentSnapshotReq {}

message AgentSnapshotRes {
  int32 ret = 2;
  ErrorInfo error = 3;
  AgentSnapshot snapshot = 4;
}

// before is the exclusive zero-based message offset. Zero requests the latest
// page.
message AgentSessionHistoryReq {
  string session_id = 1;
  uint32 before = 2;
}

message AgentSessionHistoryRes {
  int32 ret = 2;
  ErrorInfo error = 3;
  ChatSession chat_session = 4;
}

message AgentSessionModelSetReq {
  string session_id = 1;
  string model_id = 2;
}

message AgentSessionModelSetRes {
  int32 ret = 2;
  ErrorInfo error = 3;
  ChatSession chat_session = 4;
}

message AgentReasoningDeltaNtf {
  string session_id = 1;
  string message_id = 2;
  string tool_call_id = 3;
  // block.text contains only new text; terminal updates may carry an empty
  // string.
  ReasoningBlock block = 4;
  uint32 revision = 5;
}

message AgentChatReq {
  string cloud_project = 7;
  ExecutionTarget execution_target = 6;
  string session_id = 2;
  string text = 3;
  string retry_run_id = 4;
  string model_id = 5;
}

message AgentChatRes {
  int32 ret = 2;
  ErrorInfo error = 3;
  ChatSession chat_session = 4;
}

message AgentMessageCancelReq {
  string session_id = 2;
  string run_id = 3;
}

message AgentMessageCancelRes {
  int32 ret = 2;
  ErrorInfo error = 3;
}

message AgentSessionUpdatedNtf {
  ChatSession chat_session = 1;
}

message AgentMessageDeltaNtf {
  string session_id = 1;
  string run_id = 2;
  string message_id = 3;
  string delta = 4;
  uint32 revision = 5;
}

message AgentToolUpdatedNtf {
  string session_id = 1;
  string message_id = 2;
  ToolCall tool = 3;
  uint32 revision = 4;
}
