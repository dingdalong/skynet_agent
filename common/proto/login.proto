syntax = "proto3";

package skynet.agent.v1;

import "common.proto";

message LoginReq {
  string username = 1;
}

message UserIdentity {
  string user_id = 1;
  string username = 2;
}

message LoginRes {
  int32 ret = 2;
  ErrorInfo error = 3;
  UserIdentity identity = 4;
  uint32 max_message_bytes = 5;
}
