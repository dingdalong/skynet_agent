syntax = "proto3";

package skynet.agent.v1;

message ErrorInfo {
  reserved 1;
  reserved "code";
  string message = 2;
  bool retryable = 3;
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_USER = 1;
  MESSAGE_ROLE_ASSISTANT = 2;
}

enum MessageStatus {
  MESSAGE_STATUS_UNSPECIFIED = 0;
  MESSAGE_STATUS_STREAMING = 1;
  MESSAGE_STATUS_COMPLETED = 2;
  MESSAGE_STATUS_CANCELLED = 3;
  MESSAGE_STATUS_FAILED = 4;
}

message ChatMessage {
  string id = 1;
  MessageRole role = 2;
  string content = 3;
  uint64 created_at = 4;
  MessageStatus status = 5;
  string run_id = 6;
  ErrorInfo error = 7;
  int32 ret = 8;
  repeated ToolCall tool_calls = 9;
  repeated ReasoningBlock reasoning = 10;
}

message ReasoningBlock {
  string id = 1;
  string run_id = 2;
  string model_id = 3;
  string text = 4;
  string status = 5;
}

message ModelOption {
  string id = 1;
  string name = 2;
  string model = 3;
}

message ToolCall {
  string id = 1;
  string name = 2;
  string arguments = 3;
  string status = 4;
  string permission_reason = 5;
  string permission_mode = 6;
  string output = 7;
  optional int32 exit_code = 8;
  bool truncated = 9;
  repeated string changed_files = 10;
  string error = 11;
  string process_id = 12;
  string run_id = 13;
  string working_directory = 14;
  repeated ReasoningBlock reasoning = 15;
}

message SessionState {
  string id = 1;
  string title = 2;
  uint64 updated_at = 3;
  uint32 revision = 4;
  repeated ChatMessage messages = 5;
  string run_id = 6;
  bool cancelling = 7;
}

message ChatSession {
  ExecutionTarget execution_target = 4;
  SessionState session = 1;
  string model_id = 2;
  string permission_model_id = 3;
}

message UserSnapshot {
  repeated DesktopDevice desktops = 7;
  string user_id = 1;
  string username = 2;
  repeated ChatSession chat_sessions = 3;
  repeated ModelOption models = 4;
  string default_model_id = 5;
  // Empty means permission requests follow each session's selected model.
  string permission_model_id = 6;
}

message ExecutionTarget {
  string device_id = 1;
  string workspace_id = 2;
  string directory = 3;
  string platform = 4;
}
message DesktopDevice {
  string id = 1;
  string name = 2;
  bool online = 3;
  bool remote_enabled = 4;
}
