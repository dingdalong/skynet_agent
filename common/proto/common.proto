syntax = "proto3";

package skynet.agent.v1;

message ErrorInfo {
  reserved 1;
  reserved "code";
  string message = 2;
  bool retryable = 3;
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_USER = 1;
  MESSAGE_ROLE_ASSISTANT = 2;
}

enum MessageStatus {
  MESSAGE_STATUS_UNSPECIFIED = 0;
  MESSAGE_STATUS_STREAMING = 1;
  MESSAGE_STATUS_COMPLETED = 2;
  MESSAGE_STATUS_CANCELLED = 3;
  MESSAGE_STATUS_FAILED = 4;
}

message ChatMessage {
  string id = 1;
  MessageRole role = 2;
  string content = 3;
  uint64 created_at = 4;
  MessageStatus status = 5;
  string run_id = 6;
  ErrorInfo error = 7;
  int32 ret = 8;
}

message SessionState {
  string id = 1;
  string title = 2;
  uint64 updated_at = 3;
  uint32 revision = 4;
  repeated ChatMessage messages = 5;
  string run_id = 6;
  bool cancelling = 7;
}

message UserSnapshot {
  string user_id = 1;
  string username = 2;
  repeated SessionState sessions = 3;
}
