syntax = "proto3";

package skynet.agent.v1;

message ErrorInfo {
  reserved 1;
  reserved "code";

  string message = 2;
  bool retryable = 3;
}

message SessionSummary {
  string id = 1;
  string title = 2;
  uint64 updated_at = 3;
}

enum MessageRole {
  MESSAGE_ROLE_UNSPECIFIED = 0;
  MESSAGE_ROLE_USER = 1;
  MESSAGE_ROLE_ASSISTANT = 2;
}

message ChatMessage {
  string id = 1;
  MessageRole role = 2;
  string content = 3;
  uint64 created_at = 4;
}

message SessionSnapshot {
  repeated SessionSummary sessions = 1;
  string active_session_id = 2;
  repeated ChatMessage messages = 3;
}
