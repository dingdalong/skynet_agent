name: skynet-agent
x-app-database: &app-database
  APP_MONGO_HOST: ${APP_MONGO_HOST:-127.0.0.1}
  APP_MONGO_PORT: ${APP_MONGO_PORT:-18083}
  APP_MONGO_DATABASE: ${APP_MONGO_DATABASE:-applications}
  APP_MONGO_AUTH_DB: ${APP_MONGO_AUTH_DB:-${APP_MONGO_DATABASE:-applications}}
  APP_MONGO_USERNAME: ${APP_MONGO_USERNAME:-applications}
  APP_MONGO_PASSWORD: ${APP_MONGO_PASSWORD:-}
x-app-center-database: &app-center-database
  APP_CENTER_MONGO_DATABASE: ${APP_CENTER_MONGO_DATABASE:-app_center}
  APP_CENTER_MONGO_AUTH_DB: ${APP_CENTER_MONGO_AUTH_DB:-${APP_CENTER_MONGO_DATABASE:-app_center}}
  APP_CENTER_MONGO_USERNAME: ${APP_CENTER_MONGO_USERNAME:-app_center}
  APP_CENTER_MONGO_PASSWORD: ${APP_CENTER_MONGO_PASSWORD:-}
x-node: &node
  network_mode: host
  init: true
  environment: &cluster
    <<: *app-database
    APP_CENTER_PORT: ${APP_CENTER_PORT:-18081}
    GATEWAY_CLUSTER_PORT: ${GATEWAY_CLUSTER_PORT:-18082}
    CLUSTER_KEY_FILE: /cluster/gateway.key
    NODE_CONTROL_FILES: "1"
    SKYNET_CFG_CHANNEL: ${SKYNET_CFG_CHANNEL:-develop}
services:
  mongodb:
    image: mongo:8.0
    network_mode: bridge
    ports: ["127.0.0.1:${APP_MONGO_PORT:-18083}:27017"]
    environment:
      <<: [*app-database, *app-center-database]
    entrypoint: ["/bin/bash", "/mongo-start.sh"]
    volumes:
      - mongo-data:/data/db
      - ./server/deploy/mongo-start.sh:/mongo-start.sh:ro
      - ./server/deploy/mongo-init.js:/docker-entrypoint-initdb.d/app-center.js:ro
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = mongod && mongosh --quiet --eval 'quit(db.runCommand({ping:1}).ok ? 0 : 1)'"]
      interval: 2s
      timeout: 4s
      retries: 45
  app-center:
    <<: *node
    depends_on:
      mongodb: { condition: service_healthy }
    build: { context: ., dockerfile: server/Dockerfile, target: app-center }
    environment:
      <<: [*cluster, *app-center-database]
      APP_PROJECT: ${COMPOSE_PROJECT_NAME:-skynet-agent}
      APP_CENTER_ADMIN_TOKEN: ${APP_CENTER_ADMIN_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      AGENT_TOOL_TCP_PORTS: ${AGENT_TOOL_TCP_PORTS:-53,80,443}
      APP_INSTANCES: ${APP_INSTANCES:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cluster-key:/cluster
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/skynet-ready"]
      interval: 1s
      timeout: 2s
      retries: 30
  gateway:
    <<: *node
    build: { context: ., dockerfile: server/Dockerfile, target: gateway }
    depends_on:
      app-center: { condition: service_healthy }
    environment:
      <<: *cluster
      GATEWAY_PORT: ${GATEWAY_PORT:-18787}
    volumes:
      - cluster-key:/cluster:ro
volumes:
  mongo-data: {}
  cluster-key: {}
