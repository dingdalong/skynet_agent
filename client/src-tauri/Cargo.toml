[package]
name = "skynet-agent-client"
version = "0.1.0"
description = "Skynet Agent cross-platform client"
authors = ["Skynet Agent"]
edition = "2021"

[lib]
name = "skynet_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
prost-build = "0.14"
protoc-bin-vendored = "3"

[dependencies]
tauri-plugin-dialog = "2"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["sync", "time", "net", "macros", "rt"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSMenu", "NSMenuItem", "NSUserInterfaceItemIdentification"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSNotification", "NSDictionary", "NSString", "NSOperation", "NSArray"] }
block2 = "0.6"
